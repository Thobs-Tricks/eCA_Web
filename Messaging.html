<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="FeedStyle.css">
 <script src="MasterPage/MasterScript.js" defer></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}



/* Chat container */
.chat-container {
  width: 85%;
  max-width: 1100px;
  height: 75vh;
  background-color: #fff;
  display: flex;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  margin: 50px 100px; 

}

/* Sidebar */
.sidebar {
  width: 30%;
  background-color: #fff;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 15px 20px;
  font-weight: bold;
  font-size: 18px;
  border-bottom: 1px solid #ddd;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
}

.chat {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid #f1f1f1;
  transition: background 0.2s;
}

.chat:hover {
  background-color: #f9f9f9;
}

.chat img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  margin-right: 12px;
}

.chat-info h4 {
  font-size: 15px;
  margin-bottom: 3px;
}

.chat-info p {
  font-size: 13px;
  color: gray;
}

/* Chat area */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background-color: #f5f6fa;
}

.chat-header {
  background-color: #fff;
  border-bottom: 1px solid #ddd;
  padding: 15px;
  display: flex;
  align-items: center;
}

.chat-header img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  margin-right: 12px;
}

.chat-header h4 {
  font-size: 16px;
  margin-bottom: 4px;
}

.chat-header span {
  font-size: 13px;
  color: gray;
}

/* Messages */
.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  display: flex;
  margin-bottom: 15px;
}

.message .content {
  max-width: 60%;
  padding: 12px 15px;
  border-radius: 15px;
  font-size: 14px;
  line-height: 1.5;
}

.message.sent {
  justify-content: flex-end;
}

.message.sent .content {
  background-color: #ff4d4d;
  color: #fff;
  border-bottom-right-radius: 2px;
}

.message.received .content {
  background-color: #fff;
  color: #333;
  border-bottom-left-radius: 2px;
}

.message img {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  margin: 0 8px;
}

/* Input area */
.input-area {
  display: flex;
  align-items: center;
  padding: 12px 15px;
  background-color: #fff;
  border-top: 1px solid #ddd;
}

.input-area input[type="text"] {
  flex: 1;
  padding: 10px 15px;
  border: 1px solid #ddd;
  border-radius: 25px;
  outline: none;
  font-size: 14px;
}

.input-area .icons {
  display: flex;
  gap: 12px;
  margin-left: 10px;
}

.input-area .icons i {
  font-size: 18px;
  color: #555;
  cursor: pointer;
}

.input-area button {
  background-color: #ff4d4d;
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 50%;
  margin-left: 10px;
  cursor: pointer;
}

.input-area button:hover {
  background-color: #ff3333;
}

@media(max-width:480px)
{
    .chat-container {
 margin: 50px -80px;
 }
}
</style>
</head>
<body>

<div id="Header"></div>

<div class="chat-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">Messages</div>
    <div class="chat-list">
      <div class="chat active">
        <img src="https://i.pravatar.cc/100?img=1" alt="">
        <div class="chat-info">
          <h4>John Doe</h4>
          <p>Lorem ipsum dolor 😅</p>
        </div>
      </div>
      <div class="chat">
        <img src="https://i.pravatar.cc/100?img=2" alt="">
        <div class="chat-info">
          <h4>David Vane</h4>
          <p>Vestibulum ac diam...</p>
        </div>
      </div>
      <div class="chat">
        <img src="https://i.pravatar.cc/100?img=3" alt="">
        <div class="chat-info">
          <h4>Nancy Dilan</h4>
          <p>Quam vehicula...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div class="chat-header">
      <img src="https://i.pravatar.cc/100?img=1" alt="">
      <div>
        <h4>John Doe</h4>
        <span>Online</span>
      </div>
    </div>

    <div class="messages">
      <div class="message received">
        <img src="https://i.pravatar.cc/100?img=1" alt="">
        <div class="content">Hey there! How are you doing today?</div>
      </div>
      <div class="message sent">
        <div class="content">I'm good! Just working on my project 😄</div>
        <img src="https://i.pravatar.cc/100?img=4" alt="">
      </div>
      <div class="message received">
        <img src="https://i.pravatar.cc/100?img=1" alt="">
        <div class="content">That’s great! Can’t wait to see it.</div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" placeholder="Type a message...">
      <div class="icons">
           <div>
          <label for="uploadImg"><i class="fa fa-paperclip"></i> </label>
          <input type="file" id="uploadImg" style="display:none">
        </div>
      </div>
      
      <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
    fetch("MasterPage/Header.html")
        .then(res => res.text())
        .then(data => {
             document.getElementById("Header").innerHTML = data;
     
    });
 </script>

</body>
</html>
