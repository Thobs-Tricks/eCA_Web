<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>

  <style>
    body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 20px;
}


  </style>

</head>
<body>

<div class="settings-section">
  <h2>Profile information</h2>
  <div class="setting-item" onclick="openPopup('profilePopup')">Name, location, and industry</div>
  <div class="setting-item" onclick="openPopup('demographicPopup')">Personal demographic information</div>
  <div class="setting-item" onclick="openPopup('verificationPopup')">Verifications</div>
</div>

<div class="settings-section">
  <h2>Display</h2>
  <div class="setting-item" onclick="openPopup('displayPopup')">Dark mode</div>
</div>

<!-- Popup Form: Profile -->
<div class="popup" id="profilePopup">
  <div class="popup-content">
    <span class="close" onclick="closePopup('profilePopup')">&times;</span>
    <h3>Edit Name, Location, and Industry</h3>
    <form>
      <label>Name:</label>
      <input type="text" placeholder="Enter your name"><br>
      <label>Location:</label>
      <input type="text" placeholder="Enter your location"><br>
      <label>Industry:</label>
      <input type="text" placeholder="Enter your industry"><br>
      <button type="submit">Save</button>
    </form>
  </div>
</div>

<!-- Add more popups similarly -->
<div class="popup" id="demographicPopup">
  <div class="popup-content">
    <span class="close" onclick="closePopup('demographicPopup')">&times;</span>
    <h3>Personal Demographic Information</h3>
    <form>
      <label>Age:</label>
      <input type="number"><br>
      <label>Gender:</label>
      <input type="text"><br>
      <button type="submit">Save</button>
    </form>
  </div>
</div>

<div class="popup" id="verificationPopup">
  <div class="popup-content">
    <span class="close" onclick="closePopup('verificationPopup')">&times;</span>
    <h3>Verify Your Info</h3>
    <p>You can upload documents here (feature coming soon).</p>
    <button onclick="alert('Feature coming soon')">Upload</button>
  </div>
</div>

<div class="popup" id="displayPopup">
  <div class="popup-content">
    <span class="close" onclick="closePopup('displayPopup')">&times;</span>
    <h3>Display Mode</h3>
    <label><input type="checkbox"> Enable Dark Mode</label>
  </div>
</div>

<script >
  function openPopup(id) {
  document.getElementById(id).style.display = 'flex';
}

function closePopup(id) {
  document.getElementById(id).style.display = 'none';
}

</script>
</body>
</html>
