<body>

<div id="Header"></div>

<div class="Search-Bar">
         <form id="searchForm">
               <input type="search" name="search" id="searchInput" placeholder="Search..">
              <button>Submit</button>    
        </form>
        </div>
    <div class="Cards" id="Mentorscards">
        <div class="mini-card">
            <img src="Image/bob.webp" alt="">
            <h3>Mike Dot</h3>
            <h4>Graphic Designer</h4>
            <button class="Follow">Follow</button>
            <button class="hires">Hire</button> <hr>
            <a href="MentorProfile.html">View Profile</a>
        </div>

    </div>

    <script>
        fetch("MasterPage/Header.html")
        .then(res => res.text())
        .then(data => {
             document.getElementById("Header").innerHTML = data;
     
    });

    //get all mentors

    document.addEventListener('DOMContentLoaded', async ()=>{
      let MenteesContent = document.getElementById("Mentorscards");
        MenteesContent.innerHTML = "<p>Loading mentors...</p>";

        try{
          const response = await fetch("https://ca-palse-h5cjhqb3bmbddkeu.southafricanorth-01.azurewebsites.net/api/UserManagement/GetAllMentors");
           if (!response.ok) {
           const error = await response.text();
           console.error("Error loading feeds:", error);
            MenteesContent.innerHTML = "<p>Failed to load feed.</p>";
            return;
           }

  const mentors = await response.json();
    MenteesContent.innerHTML = "";

    if (!mentors || mentors.length === 0) {
      MenteesContent.innerHTML = "<p>No mentors available.</p>";
      return;
    }

    // Create mentor cards
    mentors.forEach(m => {
      MenteesContent.innerHTML += `
        <div class="mini-card">
            <img src="Image/default-avatar.png">
            <h3>${m.mentorName}</h3>
            <h4>${m.expertiseArea}</h4>

            <button class="Follow">Follow</button>
            <button class="hires">Request</button> 
            <hr>
            <a href="MentorProfile.html?id=${m.userID}">View Profile</a>
        </div>
      `;
    });

        }catch (err){
           console.error(err);
           MenteesContent.innerHTML = "<p>Failed to connect to the server.</p>";
        }
    })


    //the search engine

 
  document.getElementById("searchForm").addEventListener("input", function (e) {
    e.preventDefault();

    const searchValue = document.getElementById("searchInput").value.toLowerCase();
    const services = document.querySelectorAll(".mini-card");

    services.forEach(service => {
      const text = service.textContent.toLowerCase();
      service.style.display = text.includes(searchValue) ? "block" : "none";
    });
  });


 </script>
