<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account page</title>

    <link rel="stylesheet" href="Style.css">
      <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

   
</head>
<body>

   <div class="container"> 
    <div class="OtherSide">
        <h1><a href="Index.html"> <i>  CA Pulse  <br> <span>Network</span></i></a></h1>
        <img style="width: 360px; margin-top: 85px; opacity:0.7;" src="Image/wrtiting-tools.jpg" alt="wrtiting-tools">
    </div>
    <aside>
        <h2  class="SignInDecore" > <b>Sign In</b> </h3> 

        <form action="#" id="loginForm">

            <input type="email"  id="loginEmail"  placeholder="Email / Username" required>
           <div>
               <input type="password" id="loginPassword"  placeholder="Password" required> 
           </div>
          
           <input style="background-color: darkblue; color: white; margin-top: 20px; "  type="submit" name="Submit" id="">
        
           <div class="ForgotP">
             <a href="#"><span>Forgot your password? </span></a> 
           </div>

          <div class="SignU" >
          
          <a href="SignUp.html"><span>New to <i>LogoName</i> ? Create here. </span>  </a> 
          </div>
        
        </form>

    </aside>
   </div>
    

<script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const storedData = localStorage.getItem("userData");
      if (!storedData) {
        alert("No user found. Please sign up first.");
        return;
      }

      const user = JSON.parse(storedData);

      if (user.email === email && user.password === password) {
        // Save session info (e.g., role)
        localStorage.setItem("userRole", user.role);

        // Redirect based on role
        if (user.role === "mentor") {
          window.location.href = "MentorProfile.html";
        } else if (user.role === "company") {
          window.location.href = "Company.html";
        }
      } else {
        alert("Incorrect email or password.");
      }
    });
  </script>


</body>

</html>
