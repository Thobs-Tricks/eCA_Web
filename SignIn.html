document.getElementById("loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const emailOrPhone = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  try {
    // Step 1: Login API call
    const loginResponse = await fetch("https://ca-palse-h5cjhqb3bmbddkeu.southafricanorth-01.azurewebsites.net/api/Authentication/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ emailOrPhone, password })
    });

    if (!loginResponse.ok) {
      alert("Login failed. Please check your credentials.");
      return;
    }

    const loginData = await loginResponse.json();
    console.log("Login success:", loginData);

    // Save token & userID for later use
    localStorage.setItem("token", loginData.token);
    localStorage.setItem("userId", loginData.value);

    // Step 2: Get user details by ID
    const userResponse = await fetch(`https://ca-palse-h5cjhqb3bmbddkeu.southafricanorth-01.azurewebsites.net/api/UserManagement/GetUserBy/${loginData.value}`, {
      method: "GET",
      headers: {
        "Authorization": `Bearer ${loginData.token}`,
        "Content-Type": "application/json"
      }
    });

    if (!userResponse.ok) {
      alert("Failed to fetch user details.");
      return;
    }

    const userDetails = await userResponse.json();
    console.log("User details:", userDetails);



    // Step 3: Redirect based on userType
    if (userDetails.userType.toLowerCase() === "mentor") {
      window.location.href = "Home.html";
    } else if (userDetails.userType.toLowerCase() === "company") {
      window.location.href = "Company.html";
    } else {
      alert("User type not recognized.");
    }

  } catch (error) {
    console.error("Login error:", error);
    alert("Something went wrong while logging in. Please try again.");
  }
});


</script>
