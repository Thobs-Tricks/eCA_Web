<script>

const LOGIN_URL = "https://ca-palse-h5cjhqb3bmbddkeu.southafricanorth-01.azurewebsites.net/api/Authentication/login";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const emailOrPhone = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
     

      if (!emailOrPhone || !password) {
        alert( "Please enter both fields.");
        return;
      }

      // request body according to Swagger
      const userData = {
        emailOrPhone: emailOrPhone,
        password: password
      };

      try {
        const response = await fetch(LOGIN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(userData)
        });

        if (!response.ok) {
         alert("Invalid credentials or server error.");
          return;
        }

        const data = await response.json();
        console.log("Login response:", data);

        // Store token (adjust based on your API response)
        localStorage.setItem("token", data.token );

        // Determine role - this depends on what your API returns.
        // Example: If backend returns something like { role: "Company", ... }
        localStorage.setItem("username", data.username);
        const role = data.role;

        // Redirect user based on role
        if (role === "company") {
          window.location.href = "Company.html";
        } else if (role === "mentor") {
          window.location.href = "MentorProfile.html";
        } else if (role === "student") {
          window.location.href = "StudentProfile.html";
        } else {
          // If role not provided, redirect to a default home page
          window.location.href = "Home.html";
        }
